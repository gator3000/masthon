[build-system]
requires      = ["setuptools"]

[project]
name = "masthon"
version = "v0.1a"
description = "Read the latest Real Python tutorials"
readme = "README.md"
authors = [{ name = "org.literie.gator", email = "aelian.brd@proton.me" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: 10"
]
keywords = ["mastodon", "api", "masthon"]
dependencies = [
    "requests",
    "typing",
    "re",
    "time",
    "json",
    "traceback"
]
requires-python = ">=3.10"


[project.urls]
Homepage = "https://gitlab.com/Gator3000/masthon"
Bug_Tracker = "https://gitlab.com/Gator3000/masthon/-/issues"